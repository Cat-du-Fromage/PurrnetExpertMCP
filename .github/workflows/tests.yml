name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.20"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync python -m unittest discover -s scripts -p "test*.py" -v
      - run: uv run --no-sync python scripts/validate_skill.py --release
      - run: uv build --wheel
